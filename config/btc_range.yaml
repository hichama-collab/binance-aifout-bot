    trendMaxDriftPct: 0.0080
    trendMaxAgainstPct: 0.010

    buyZoneFrac: 0.12
    targetZoneFrac: 0.85
    stopRangeFrac: 0.06
    atrStopMult: 1.2
    minStopDistancePct: 0.002

    minRewardRisk: 2.0

    reboundConfirmTicks: 7
    reboundMinPct: 0.0008
    reboundMinUpRatio: 0.7
    ticksKeepSec: 900.0

    spreadMaxPct: 0.0006
    entryCrossSpread: false
    entryAutoCrossSpreadPct: 0.00015

    maxUsdcPerTrade: 50.0
    minOrderNotionalUsdc: 10.0

    protectActivateFrac: 0.20
    protectLockFrac: 0.03
    trailStopPct: 0.003

    maxHoldSec: 2700.0
    staleAfterSec: 900.0
    staleMinProgressFrac: 0.15

    entryCooldownSec: 300.0
    cooldownWinSec: 120.0
    cooldownLossSec: 360.0

    chkEvery: 30.0
    idleSleep: 0.5
    allowExistingBaseBalance: false

