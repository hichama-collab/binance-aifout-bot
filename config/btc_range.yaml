profiles:
  default:
    symbol: BTCUSDC
    rangeTimeframe: 5m
    rangeWindowBars: 24
    contextWindowBars: 72
    rangeRefreshSec: 30.0

    # Range filters
    minRangePct: 0.0025
    maxRangePct: 0.0180
    trendMaxDriftPct: 0.0120

    # NEW: Trend filter
    trendMaxAgainstPct: 0.015

    # Entry zone (lower = buy closer to low)
    buyZoneFrac: 0.15
    targetZoneFrac: 0.80

    # Tighter stop
    stopRangeFrac: 0.08

    # NEW: ATR stop
    atrStopMult: 1.5
    minStopDistancePct: 0.003

    minRewardRisk: 1.50

    # Stronger rebound confirmation
    reboundConfirmTicks: 5
    reboundMinPct: 0.0005
    reboundMinUpRatio: 0.6
    ticksKeepSec: 900.0

    spreadMaxPct: 0.0008
    entryCrossSpread: false
    entryAutoCrossSpreadPct: 0.00020

    maxUsdcPerTrade: 75.0
    minOrderNotionalUsdc: 10.0

    # Earlier protection
    protectActivateFrac: 0.25
    protectLockFrac: 0.05

    # NEW: Trailing stop
    trailStopPct: 0.004

    # Shorter hold times
    maxHoldSec: 3600.0
    staleAfterSec: 1200.0
    staleMinProgressFrac: 0.12

    entryCooldownSec: 180.0
    cooldownWinSec: 90.0
    cooldownLossSec: 240.0

    chkEvery: 30.0
    idleSleep: 0.5
    allowExistingBaseBalance: false

  # NEW: Conservative profile for testing
  conservative:
    symbol: BTCUSDC
    rangeTimeframe: 5m
    rangeWindowBars: 24
    contextWindowBars: 96
    rangeRefreshSec: 30.0

    minRangePct: 0.0030
