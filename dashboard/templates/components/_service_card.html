{# === FILE: dashboard/templates/components/_service_card.html === #}
{% macro service_card() %}
{# Usage: include inside a loop over services array in Alpine.js — see services.html #}
<div :class="serviceCardClass(svc.state)" x-data>
  <div class="flex items-start justify-between gap-3 mb-3">
    <div class="flex items-center gap-2 min-w-0">
      <div class="service-dot" :class="dotClass(svc.state)"></div>
      <div class="min-w-0">
        <div class="font-mono text-xs font-semibold text-[#EAECEF] truncate" x-text="svc.unit"></div>
        <div class="text-xs text-[#848E9C] mt-0.5">
          <span x-text="svc.state || 'unknown'"></span>
          <span x-show="svc.sub && svc.sub !== svc.state"> · <span x-text="svc.sub"></span></span>
        </div>
      </div>
    </div>
    <span class="badge flex-shrink-0"
          :class="stateClass(svc.state)"
          x-text="svc.state || '?'"></span>
  </div>

  <div class="text-xs text-[#848E9C] mb-3 space-y-0.5">
    <div x-show="svc.since">
      <span class="text-[#B7BDC6]">Uptime:</span>
      <span class="font-mono" x-text="fmtDuration(svc.since)"></span>
    </div>
    <div x-show="svc.since">
      <span class="text-[#B7BDC6]">Since:</span>
      <span class="font-mono" x-text="fmtTs(svc.since)"></span>
    </div>
  </div>

  <div class="flex gap-1.5 flex-wrap">
    <button class="btn btn-sm btn-ghost"
            :disabled="actionInProgress[svc.unit+'-start'] || svc.state === 'active'"
            @click="requestAction(svc.unit, 'start')">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/>
        <path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
      Start
    </button>
    <button class="btn btn-sm btn-ghost"
            :disabled="actionInProgress[svc.unit+'-stop'] || svc.state !== 'active'"
            @click="requestAction(svc.unit, 'stop')">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0zM9 10a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1v-4z"/>
      </svg>
      Stop
    </button>
    <button class="btn btn-sm btn-ghost"
            :disabled="actionInProgress[svc.unit+'-restart']"
            @click="requestAction(svc.unit, 'restart')">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
      </svg>
      Restart
    </button>
  </div>
</div>
{% endmacro %}
